services:
  frontend:
    build:
      context: ./frontend
    container_name: oc-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    depends_on:
      - backend
    networks:
      - oc-network

  backend:
    build:
      context: ./backend
    container_name: oc-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: "mongodb://oc-mongo:27017/online-compiler"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: change_this_secret
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
      EXECUTION_TIMEOUT_MS: 120000
      EXECUTION_MEMORY_LIMIT: 256m
      EXECUTION_WORKSPACE_VOLUME: "online-compiler_execution-workspace"

      MYSQL_HOST: compiler-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: compiler

      ORACLE_USER: compiler
      ORACLE_PASSWORD: Compiler123
      ORACLE_CONNECT_STRING: "oracle-free:1521/FREEPDB1"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - execution-workspace:/tmp/oc-executions

    depends_on:
      - mongo

    networks:
      - oc-network

  mongo:
    image: mongo:8.0
    container_name: oc-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - oc-network

networks:
  oc-network:
    name: oc-network
    driver: bridge

volumes:
  mongo-data:

  execution-workspace:
    name: online-compiler_execution-workspace

